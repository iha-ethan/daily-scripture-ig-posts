name: Daily scripture post

on:
  schedule:
    - cron: "0 12 * * *" # 12:00 UTC = 8 AM Eastern (7 AM in winter). GitHub may start it a few minutes late.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only render the image (download it from the run's artifacts); don't post"
        type: boolean
        default: true
      date:
        description: "Date to render, YYYY-MM-DD (blank = today)"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

env:
  TIMEZONE: ${{ vars.TIMEZONE || 'America/New_York' }}
  IG_HANDLE: ${{ vars.IG_HANDLE }}
  HASHTAGS: ${{ vars.HASHTAGS }}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Work out the date
        id: day
        run: |
          DAY="${{ inputs.date }}"
          if [ -z "$DAY" ]; then DAY=$(TZ="$TIMEZONE" date +%F); fi
          echo "date=$DAY" >> "$GITHUB_OUTPUT"
          echo "posted=$(python main.py already-posted --date "$DAY")" >> "$GITHUB_OUTPUT"

      - name: Render image
        if: steps.day.outputs.posted != 'true'
        env:
          NLT_API_KEY: ${{ secrets.NLT_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python main.py render --date "${{ steps.day.outputs.date }}"

      - name: Save preview
        if: steps.day.outputs.posted != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: post-${{ steps.day.outputs.date }}
          path: posts/${{ steps.day.outputs.date }}.*

      - name: Commit image so Instagram can fetch it
        id: commit
        if: steps.day.outputs.posted != 'true' && (github.event_name == 'schedule' || !inputs.dry_run)
        run: |
          DAY="${{ steps.day.outputs.date }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "posts/$DAY.jpg" "posts/$DAY.json"
          git commit -m "Render post for $DAY"
          git push
          URL="https://raw.githubusercontent.com/${{ github.repository }}/$(git rev-parse HEAD)/posts/$DAY.jpg"
          # Make sure the image is publicly reachable before handing it to Instagram.
          for i in 1 2 3 4 5 6; do
            curl -sfI "$URL" > /dev/null && break
            echo "Image not reachable yet, retrying..."; sleep 10
          done
          curl -sfI "$URL" > /dev/null || { echo "::error::$URL is not publicly reachable. Is the repository public?"; exit 1; }
          echo "image_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Publish to Instagram
        if: steps.commit.outputs.image_url
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python main.py publish --date "${{ steps.day.outputs.date }}" --image-url "${{ steps.commit.outputs.image_url }}"

      - name: Record that it was posted
        if: steps.commit.outputs.image_url
        run: |
          git add posts/
          git commit -m "Posted ${{ steps.day.outputs.date }} to Instagram"
          git push
