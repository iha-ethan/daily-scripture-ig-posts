name: Refresh Instagram token

# Instagram long-lived tokens expire after 60 days. This swaps in a fresh one every month.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh and save the token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }} # fine-grained token with "Secrets: Read and write" on this repo
        run: |
          NEW_TOKEN=$(python main.py refresh-token)
          echo "::add-mask::$NEW_TOKEN"
          gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" --body "$NEW_TOKEN"
          echo "Instagram token refreshed."
